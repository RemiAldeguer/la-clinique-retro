name: Vérification de l’application

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Tests et compilations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer les dépendances
        run: npm install
      - name: Exécuter les 32 tests métier
        run: npm test
      - name: Vérifier les types et compiler le site
        run: npm run build
      - name: Conserver le site statique
        uses: actions/upload-artifact@v4
        with:
          name: clinique-retro-site-statique
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Construire le fichier HTML autonome
        run: npm run build:offline
      - name: Conserver l’édition autonome
        uses: actions/upload-artifact@v4
        with:
          name: clinique-retro-html-autonome
          path: dist/index.html
          if-no-files-found: error
          retention-days: 14
